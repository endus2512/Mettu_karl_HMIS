[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mettu-karl-his-backend"
version = "0.1.0"
description = "Mettu Karl Hospital Information System - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fhir.resources>=7.1.0",
    "httpx>=0.27.0",
    "sentry-sdk[fastapi]>=1.42.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "python-multipart>=0.0.9",
    "minio>=7.2.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
