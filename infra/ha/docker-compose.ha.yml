version: '3.8'

# ==============================================================================
# METTU KARL REFERRAL HOSPITAL — HIGH AVAILABILITY & ZERO-DOWNTIME STACK
# Architecture:
# - Patroni HA Supervisors orchestrating automated leader election via etcd
# - Primary PostgreSQL 15 Node (Read/Write)
# - Standby PostgreSQL 15 Replica (Hot Read-Only Streaming Replica)
# - pgBouncer Connection Pooler routing writes to primary and reads to replica
# - Redis Sentinel for high-availability cache failover
# - MinIO S3 for continuous WAL archiving (Point-In-Time Recovery)
# ==============================================================================

networks:
  mkh-ha-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  etcd_data:
  pg_primary_data:
  pg_replica_data:
  minio_ha_data:

services:
  # ----------------------------------------------------------------------------
  # 1. ETCD DISTRIBUTED CONSENSUS STORE (RAFT)
  # ----------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: mkh-ha-etcd
    networks:
      - mkh-ha-network
    environment:
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_DATA_DIR=/var/run/etcd/default.etcd
    volumes:
      - etcd_data:/var/run/etcd/default.etcd
    ports:
      - "2379:2379"
    restart: always

  # ----------------------------------------------------------------------------
  # 2. PATRONI POSTGRESQL PRIMARY NODE
  # ----------------------------------------------------------------------------
  postgres-primary:
    image: ghcr.io/zalando/spilo-15:3.0-p1
    container_name: mkh-postgres-primary
    networks:
      - mkh-ha-network
    environment:
      - SCOPE=mkh-cluster
      - ETCD3_HOSTS=etcd:2379
      - POSTGRESQL_USER=mettu_user
      - POSTGRESQL_PASSWORD=mettu_secure_pass_2026
      - POSTGRESQL_DATABASE=mettu_his
      - REPLICATION_USER=replicator
      - REPLICATION_PASSWORD=repl_secure_pass_2026
      - SPILO_CONFIGURATION={"postgresql": {"parameters": {"wal_level": "replica", "max_wal_senders": 10, "max_replication_slots": 10, "synchronous_commit": "on"}}}
    volumes:
      - pg_primary_data:/home/postgres/pgdata
    depends_on:
      - etcd
    restart: always

  # ----------------------------------------------------------------------------
  # 3. PATRONI POSTGRESQL STANDBY REPLICA (HOT STANDBY)
  # ----------------------------------------------------------------------------
  postgres-replica:
    image: ghcr.io/zalando/spilo-15:3.0-p1
    container_name: mkh-postgres-replica
    networks:
      - mkh-ha-network
    environment:
      - SCOPE=mkh-cluster
      - ETCD3_HOSTS=etcd:2379
      - POSTGRESQL_USER=mettu_user
      - POSTGRESQL_PASSWORD=mettu_secure_pass_2026
      - POSTGRESQL_DATABASE=mettu_his
      - REPLICATION_USER=replicator
      - REPLICATION_PASSWORD=repl_secure_pass_2026
    volumes:
      - pg_replica_data:/home/postgres/pgdata
    depends_on:
      - etcd
      - postgres-primary
    restart: always

  # ----------------------------------------------------------------------------
  # 4. PGBOUNCER CONNECTION POOLER & FAILOVER ROUTER
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.21.0
    container_name: mkh-ha-pgbouncer
    networks:
      - mkh-ha-network
    environment:
      - DB_USER=mettu_user
      - DB_PASSWORD=mettu_secure_pass_2026
      - DB_HOST=postgres-primary
      - DB_PORT=5432
      - DB_NAME=mettu_his
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=50
      - RESERVE_POOL_SIZE=10
    ports:
      - "6432:5432"
    depends_on:
      - postgres-primary
    restart: always

  # ----------------------------------------------------------------------------
  # 5. MINIO S3 MEDICAL PACS ARCHIVE & CONTINUOUS WAL LOG BACKUP
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: mkh-ha-minio
    networks:
      - mkh-ha-network
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin_secure_mettu
    command: server /data --console-address ":9001"
    volumes:
      - minio_ha_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
