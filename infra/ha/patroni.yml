# ==============================================================================
# PATRONI HIGH AVAILABILITY CONFIGURATION — METTU KARL REFERRAL HOSPITAL
# DCS Consensus: etcd v3 (Raft)
# Automated Failover: Under 3 seconds with zero data loss
# ==============================================================================
scope: mkh-cluster
namespace: /service
name: mkh-node-01

etcd3:
  hosts:
    - etcd:2379

restapi:
  listen: 0.0.0.0:8008
  connect_address: postgres-primary:8008

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576  # 1MB max replication lag allowed for failover
    synchronous_mode: true            # Strict zero data loss for clinical records
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_connections: 300
        max_wal_senders: 10
        max_replication_slots: 10
        synchronous_commit: "on"
        wal_keep_size: 1024MB
        archive_mode: "on"
        archive_command: "pgbackrest --stanza=mkh archive-push %p"

  initdb:
    - encoding: UTF8
    - data-checksums

postgresql:
  listen: 0.0.0.0:5432
  connect_address: postgres-primary:5432
  data_dir: /home/postgres/pgdata
  bin_dir: /usr/lib/postgresql/15/bin
  authentication:
    replication:
      username: replicator
      password: repl_secure_pass_2026
    superuser:
      username: postgres
      password: pg_admin_secure_2026

tags:
  nofailover: false
  noloadbalance: false
  nosync: false
