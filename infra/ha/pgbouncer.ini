[databases]
mettu_his = host=postgres-primary port=5432 dbname=mettu_his
mettu_his_ro = host=postgres-replica port=5432 dbname=mettu_his

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = mettu_admin
stats_users = mettu_monitor

# Pool Configuration for High-Concurrency Clinical Workstations
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 5.0
max_db_connections = 100

# Resilience & Timeouts (Tuned for Illubabor grid stability)
server_connect_timeout = 5.0
server_login_retry = 3
query_timeout = 60.0
idle_transaction_timeout = 120.0
