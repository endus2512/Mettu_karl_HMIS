apiVersion: v1
kind: ConfigMap
metadata:
  name: his-config
  namespace: mettu-karl-his
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_NAME: "Mettu Karl HIS"
  APP_VERSION: "1.0.0"
  REDIS_URL: "redis://redis-service.mettu-karl-his.svc.cluster.local:6379/0"
  MINIO_ENDPOINT: "minio-service.mettu-karl-his.svc.cluster.local:9000"
  MINIO_BUCKET_NAME: "mettu-karl-his"
  MINIO_SECURE: "false"
  CORS_ORIGINS: "http://his.mettukarl.hospital,https://his.mettukarl.hospital"
  FHIR_SERVER_BASE_URL: "https://his.mettukarl.hospital/api/v1/fhir/r4"
  AUDIT_LOG_FILE: "/var/log/mettu-karl-his/audit.log"
