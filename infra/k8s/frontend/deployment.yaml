apiVersion: apps/v1
kind: Deployment
metadata:
  name: his-frontend
  namespace: mettu-karl-his
  labels:
    app: his-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: his-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: his-frontend
    spec:
      containers:
        - name: frontend
          image: mettu-karl-his/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
