services:
  - type: web
    name: mettu-karl-his-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt || pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./mettu_his.db
      - key: CORS_ORIGINS
        value: https://mettu-karl-hospital.vercel.app,https://endus2512.github.io,http://localhost:3000
