name: Chainguard DevSecOps & Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions required for Keyless Cosign Signing (OIDC) and GitHub Packages (GHCR)
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build-sign-attest:
    name: Build, Scan, SBOM & Cosign Sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 0. Compute lowercase, repository-scoped GHCR image names to avoid cross-repo permission clashes
      - name: Compute Container Image Names
        id: repo
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]_' '[:lower:]-')
          echo "backend_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}-frontend" >> "$GITHUB_OUTPUT"

      # 1. Install Cosign (Sigstore / Chainguard ecosystem tool)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      # 2. Setup Docker Buildx for optimized builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate with GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract Docker Metadata (Tags, Labels)
      - name: Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.backend_image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.frontend_image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # 5. Build and Push Chainguard-based Containers
      - name: Build & Push Backend Image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Generate Software Bill of Materials (SBOM) using Syft
      - name: Generate Backend SBOM (SPDX JSON)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ steps.repo.outputs.backend_image }}@${{ steps.build-backend.outputs.digest }}
          format: 'spdx-json'
          output-file: 'backend-sbom.spdx.json'
          upload-artifact: false

      - name: Generate Frontend SBOM (SPDX JSON)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ steps.repo.outputs.frontend_image }}@${{ steps.build-frontend.outputs.digest }}
          format: 'spdx-json'
          output-file: 'frontend-sbom.spdx.json'
          upload-artifact: false

      - name: Upload SBOM Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-reports
          path: |
            backend-sbom.spdx.json
            frontend-sbom.spdx.json
          retention-days: 30

      # 7. Vulnerability Scan with Grype (audit report logged without blocking on upstream transitive CVEs)
      - name: Scan Backend Image with Grype
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@v4
        with:
          image: ${{ steps.repo.outputs.backend_image }}@${{ steps.build-backend.outputs.digest }}
          fail-build: false
          severity-cutoff: high

      - name: Scan Frontend Image with Grype
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@v4
        with:
          image: ${{ steps.repo.outputs.frontend_image }}@${{ steps.build-frontend.outputs.digest }}
          fail-build: false
          severity-cutoff: high

      # 8. Keyless Cryptographic Signing with Cosign via GitHub OIDC
      - name: Sign Backend Container Image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${{ steps.repo.outputs.backend_image }}@${{ steps.build-backend.outputs.digest }}"

      - name: Sign Frontend Container Image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${{ steps.repo.outputs.frontend_image }}@${{ steps.build-frontend.outputs.digest }}"

      # 9. Cryptographically Attest the SPDX JSON SBOM to the Container
      - name: Attest Backend SBOM
        if: github.event_name != 'pull_request'
        run: |
          cosign attest --yes \
            --predicate backend-sbom.spdx.json \
            --type spdxjson \
            "${{ steps.repo.outputs.backend_image }}@${{ steps.build-backend.outputs.digest }}"

      - name: Attest Frontend SBOM
        if: github.event_name != 'pull_request'
        run: |
          cosign attest --yes \
            --predicate frontend-sbom.spdx.json \
            --type spdxjson \
            "${{ steps.repo.outputs.frontend_image }}@${{ steps.build-frontend.outputs.digest }}"

      # 10. Verify Image Signatures & Attestations
      - name: Verify Signed Artifacts
        if: github.event_name != 'pull_request'
        run: |
          echo "Verifying Backend Signature with GitHub OIDC certificate..."
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.repo.outputs.backend_image }}@${{ steps.build-backend.outputs.digest }}"

          echo "Verifying Frontend Signature with GitHub OIDC certificate..."
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.repo.outputs.frontend_image }}@${{ steps.build-frontend.outputs.digest }}"
