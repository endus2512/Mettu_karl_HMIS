name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov httpx aiosqlite bcrypt
          pip install -e .

      - name: Run Ruff Linting
        run: |
          cd backend
          ruff check . --exit-zero

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-very-secure"
          APP_ENV: "test"
          REDIS_URL: "redis://localhost:6379/0"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"
        run: |
          cd backend
          pytest tests/ -v -k "not (test_accounting or test_assets or test_billing or test_blood_bank or test_cdss or test_ems or test_hrm_payroll or test_insurance_power or test_queue)"

  frontend-checks:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: |
          cd frontend
          npm run type-check || npx tsc --noEmit

      - name: Run Next.js Build
        run: |
          cd frontend
          npm run build
